{% extends 'base.html' %}

{% block title %}حذف الإنجاز{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="form-card mx-auto text-center" style="max-width:500px">
    <div class="mb-4">
      <i class="fas fa-exclamation-triangle fa-4x text-danger mb-3"></i>
      <h4>هل أنت متأكد من الحذف؟</h4>
      <p class="text-muted">سيتم حذف الإنجاز التالي نهائياً ولا يمكن التراجع:</p>
      <div class="alert alert-danger fw-bold">{{ achievement.title }}</div>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-3 justify-content-center">
        <button type="submit" class="btn btn-danger px-5 py-2">
          <i class="fas fa-trash me-2"></i>نعم، احذف
        </button>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4 py-2">
          <i class="fas fa-times me-2"></i>إلغاء
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
