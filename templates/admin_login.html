{% extends 'base.html' %}
{% load static %}

{% block title %}تسجيل الدخول — لوحة التحكم{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header text-center mb-4">
      <i class="fas fa-lock fa-3x gold-icon mb-3"></i>
      <h3>دخول لوحة التحكم</h3>
      <p class="text-muted small">للمسؤولين فقط</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-bold">اسم المستخدم</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-bold">كلمة المرور</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-key"></i></span>
          <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required>
        </div>
      </div>
      <button type="submit" class="btn btn-gold w-100 py-2">
        <i class="fas fa-sign-in-alt me-2"></i>دخول
      </button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'book' %}" class="text-muted small"><i class="fas fa-arrow-right me-1"></i>العودة للرئيسية</a>
    </div>
  </div>
</div>
{% endblock %}
